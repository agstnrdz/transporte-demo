name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir sitio
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Consolidar recorridos (data/linea-*.geojson → recorridos.geojson)
        run: node tools/build-datos.mjs

      - name: Armar _site según el modo mantenimiento
        run: node tools/build-pages.mjs _site

      # La rama `deploy` es un espejo del sitio ya construido, para quien lo
      # despliega en otro servidor (transporte.comodoro.gov.ar) sin correr Node:
      # le alcanza con clonar esa rama y hacer git pull. Se conserva el historial
      # —no se fuerza el push— justamente para que ese pull sea siempre limpio.
      - name: Espejar _site en la rama deploy
        env:
          REMOTO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Si la rama todavía no existe (primera corrida), se arranca vacía.
          if ! git clone --quiet --depth 1 --branch deploy "$REMOTO" espejo; then
            echo "La rama deploy no existe: se crea en esta corrida."
            mkdir espejo
            git -C espejo init --quiet -b deploy
            git -C espejo remote add origin "$REMOTO"
          fi

          # El contenido de _site reemplaza al anterior; se borra lo que ya no está.
          find espejo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a _site/. espejo/

          cd espejo
          git add --all
          if git diff --cached --quiet; then
            echo "El sitio construido no cambió: no hay nada que publicar en deploy."
            exit 0
          fi
          git commit --quiet -m "deploy: sitio construido desde ${GITHUB_SHA::7}"
          git push --quiet origin deploy
          echo "Rama deploy actualizada."

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Desplegar en Pages
        id: deploy
        uses: actions/deploy-pages@v4
