name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir sitio
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Consolidar recorridos (data/linea-*.geojson → recorridos.geojson)
        run: node tools/build-datos.mjs

      - name: Armar _site según el modo mantenimiento
        run: node tools/build-pages.mjs _site

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Desplegar en Pages
        id: deploy
        uses: actions/deploy-pages@v4
